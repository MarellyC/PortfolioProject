<body>

    <header class="jumbotron jumbotron-fluid">
        <div class="container">
            <div class="row row-content align-items-center">
                <div class="col text-sm-center">
                    <h1>Welcome to High Times Cafe</h1>
                    <h3>A 4/20 friendly cafe open to all</h3>
                </div>
            </div>
        </div>
    </header>

    <nav class="navbar navbar-expand-sm navbar-dark sticky-top">
        <div class="container">
            <button class="navbar-toggler ml-auto" type="button" data-toggle="collapse" data-target="#nucampNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nucampNavbar">
                <ul class="navbar-nav">

    <main class="container py-4">
        <h2 class="text-sm-center">Email Us!</h2>
        <form class="cf mx-auto" style="max-width:800px;">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <input type="text" id="name" class="form-control" placeholder="Name">
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" class="form-control" placeholder="Email address">
                    </div>
                    <div class="form-group">
                        <input type="text" id="subject" class="form-control" placeholder="Subject">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <textarea name="message" id="message" class="form-control" rows="8" placeholder="Message"></textarea>
                    </div>
                </div>
            </div>
            <div class="text-center">
                <input type="submit" value="Submit" id="submit" class="btn btn-primary">
            </div>
        </form>
    </main>

                </div>
